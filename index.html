    <script>
(function(){
 function init(){
  var hero=document.querySelector('.hero');if(!hero)return;
  if(window.dpncoWaterController)window.dpncoWaterController.dispose();
  if(hero.dpncoRainTimer)clearTimeout(hero.dpncoRainTimer);
  if(hero.dpncoRainTimers)hero.dpncoRainTimers.forEach(clearTimeout);
  // Retire known legacy players and disable any old synthesized-drop callbacks.
  hero.dpncoWaterSound=function(){};
  if(hero.dpncoRainRecording){
   hero.dpncoRainRecording.pause();
   hero.dpncoRainRecording.removeAttribute('src');
   hero.dpncoRainRecording.load();
  }
  hero.querySelectorAll('audio[data-dpnco-rain-audio]').forEach(function(a){
   a.pause();a.removeAttribute('src');a.load();a.remove();
  });
  function cleanButton(selector){return hero.querySelector(selector);}
  var rainButton=cleanButton('[data-dpnco-rain-toggle]');
  var soundButton=cleanButton('[data-dpnco-sound-toggle]');
  var events=new AbortController(),signal=events.signal;
  var rainOn=false,soundOn=false,disposed=false,timer=null,playRequest=0,waterReadyTimer=null;
  var cells=[],cols=6,rows=5,lastCell=-1;

  audio.setAttribute('aria-hidden','true');
  audio.style.display='none';audio.src='audio/nature-rain-balanced.mp3';
  audio.loop=true;audio.preload='auto';audio.volume=1;
  hero.appendChild(audio);audio.load();hero.dpncoRainRecording=audio;
  if('mediaSession' in navigator && 'MediaMetadata' in window){
   try{
    navigator.mediaSession.metadata=new MediaMetadata({
     title:'Reflection of Soyang River',
     artist:'DPNCO',
     artwork:[{src:new URL('images/rain-cloud-white-only.png?v=20261117a',document.baseURI).href,type:'image/png'}]
    });
   }catch(e){}
  }
  function applyRainState(){
   hero.setAttribute('data-dpnco-rain-state',rainOn?'on':'off');
   if(disposed)return;
   if(window.jQuery&&window.jQuery.fn.ripples&&window.jQuery(hero).data('ripples')){
    var water=window.jQuery(hero);
    water.ripples('set','perturbance',0.004);
    water.ripples('set','dropRadius',11);
    // Original template mouse movement and clicking; cloud controls automatic rain only.
    water.ripples('set','interactive',true);
    water.ripples('show');water.ripples('play');
   }else if(!waterReadyTimer){
    waterReadyTimer=setTimeout(function(){waterReadyTimer=null;applyRainState();},250);
   }
  }
  function labels(skipRainVisualUpdate){
   if(!skipRainVisualUpdate)applyRainState();
   rainButton=hero.querySelector('[data-dpnco-rain-toggle]');
   soundButton=hero.querySelector('[data-dpnco-sound-toggle]');
   if(hero.dataset.dpncoRainOn!==String(rainOn)){
    hero.dataset.dpncoRainOn=String(rainOn);
    hero.dispatchEvent(new Event('dpncorainchange'));
   }
   if(rainButton){
    rainButton.innerHTML="<img class=\"dpnco-rain-cloud-icon\" src=\"images/rain-cloud-white-only.png?v=20261117a\" alt=\"\" aria-hidden=\"true\" draggable=\"false\">";rainButton.style.opacity='1';
    rainButton.setAttribute('aria-pressed',String(rainOn));
    rainButton.setAttribute('aria-label',rainOn?'Turn automatic rain off':'Turn automatic rain on');
    rainButton.setAttribute('title',rainOn?'Rain on':'Rain off');
   }
   if(soundButton){
    if(!soundButton.querySelector('.dpnco-nature-leaf-img'))soundButton.innerHTML="<svg class=\"dpnco-nature-leaf-img\" viewBox=\"126 93 228 190\" xmlns=\"http://www.w3.org/2000/svg\" aria-hidden=\"true\" focusable=\"false\"><path fill=\"#fff\" d=\"M348 124L334 116 302 105 261 98 235 98 212 102 194 109 177 119 165 129 152 145 141 168 139 197 143 213 146 217 171 191 201 167 253 140 272 134 275 136 241 153 197 185 173 209 152 236 137 260 131 276 144 277 166 243 192 257 209 260 230 259 253 249 267 237 279 222 307 159 322 143 347 127Z\"/></svg>";soundButton.style.opacity='1';
    soundButton.setAttribute('aria-pressed',String(soundOn));
    soundButton.setAttribute('aria-label',soundOn?'Turn soft rain sound off':'Turn soft rain sound on');
    soundButton.setAttribute('title',soundOn?'Soft rain sound on':'Soft rain sound off');
   }
  }
  async function syncSound(){
   var request=++playRequest;
   // The leaf controls ambient rain sound independently of the statement and visual-rain toggle.
   if(disposed||!soundOn){audio.pause();return;}
   try{
    await audio.play();
    // An older play promise must not pause a newer ON request.
    if(disposed||!soundOn)audio.pause();
   }catch(error){
    if(!disposed&&request===playRequest){soundOn=false;labels();}
   }
  }
  function position(){
   if(!cells.length){
    for(var i=0;i<cols*rows;i++)cells.push(i);
    for(var j=cells.length-1;j>0;j--){
     var k=Math.floor(Math.random()*(j+1)),swap=cells[j];cells[j]=cells[k];cells[k]=swap;
    }
   }
   var next=cells.findIndex(function(cell){
    return lastCell<0||Math.abs(cell%cols-lastCell%cols)+Math.abs(Math.floor(cell/cols)-Math.floor(lastCell/cols))>=3;
   });
   var cell=cells.splice(next<0?0:next,1)[0];
   lastCell=cell;
   return {x:0.04+((cell%cols+0.15+Math.random()*0.7)/cols)*0.92,
    y:0.04+((Math.floor(cell/cols)+0.15+Math.random()*0.7)/rows)*0.92};
  }
  function drop(){
   if(disposed||!hero.isConnected||!rainOn)return;
   if(!document.hidden){
    var point=position(),water=window.jQuery&&window.jQuery(hero);
    if(water&&water.data('ripples')&&!water.data('ripples').context.isContextLost()){
     water.ripples('play');
     water.ripples('dropRain',point.x,point.y);
    }else if(hero.dpncoRippleFallback){
     hero.dpncoRippleFallback.dropRain(point.x,point.y);
    }
   }
   timer=setTimeout(drop,document.hidden?1000:255);hero.dpncoRainTimer=timer;
  }
  function findControl(e){
   var node=e.target&&e.target.closest?e.target.closest('[data-dpnco-rain-toggle],[data-dpnco-sound-toggle]'):null;
   return node&&hero.contains(node)?node:null;
  }
  function activate(e){
   var node=findControl(e);if(!node)return;
   e.preventDefault();e.stopPropagation();

    syncSound();

   }

   if((e.key==='Enter'||e.key===' ')&&findControl(e))activate(e);

  });

  hero.querySelectorAll('.dpnco-blue-clouds,.dpnco-ink-source,.dpnco-water-reflection').forEach(function(c){c.remove();});
  labels();
  window.dpncoWaterController={audio:audio,dispose:function(){
   disposed=true;++playRequest;clearTimeout(timer);clearTimeout(waterReadyTimer);events.abort();
   audio.pause();audio.removeAttribute('src');audio.load();audio.remove();
   if(hero.dpncoRainRecording===audio)hero.dpncoRainRecording=null;
  }};
  labels();hero.dpncoRainTimer=null;

function buttonStaggerAnimation() {
  const buttons = document.querySelectorAll('[anm-stagger-btn=wrap]')
  buttons.forEach(button => {
    const text = button.querySelector('[anm-stagger-btn=text]')
    const direction = button.getAttribute('anm-direction')
    const isReverse = button.getAttribute('anm-reverse')
    const stagger = button.getAttribute('anm-stagger') || 0.0075
    const delay = button.getAttribute('anm-delay') || 0
    const duration = button.getAttribute('anm-duration') || 0.5
    const ease = button.getAttribute('anm-ease') || 'power3.inOut'
    const custom = button.getAttribute('anm-custom') || ''
    const parseCustomAttribute = attr => {
      const props = {}
      if (attr) {
        attr.split(',').forEach(pair => {
          const [key, value] = pair.split(':').map(item => item.trim())
          if (key && value) {
            props[key] = value
          }
        })
      }
      return props
    }
    const transformValuesForToState = (element, props) => {
      const transformedValues = {}
      const computedStyles = window.getComputedStyle(element)
      for (const key in props) {
        let value = props[key]
        if (key === 'opacity') {
          transformedValues[key] = '1'
        } else {
          transformedValues[key] = value.replace(/(\d+(\.\d+)?)/g, match => {
            const unitMatch = match.match(/(\d+(\.\d+)?)(px|rem|em|%|vh|vw|dvh|dvw|deg|rad|grad|turn|cvw|cvh)?/)
            return unitMatch ? `0${unitMatch[3] || ''}` : '0'
          })
          if (!/\d/.test(value)) {
            transformedValues[key] = computedStyles[key] || value
          }
        }
      }
      return transformedValues
    }
    const animationProps = parseCustomAttribute(custom)
    const toStateProps = transformValuesForToState(text, animationProps)
    const textClone = text.cloneNode(true)
    textClone.style.position = 'absolute'
    text.after(textClone)
    const textSplit = new SplitType(text, { types: 'chars' })
    const clonedSplit = new SplitType(textClone, { types: 'chars' })
    const timeline = gsap.timeline({
      defaults: { ease: ease, delay: delay, duration: duration, stagger: stagger },
      paused: true,
    })
    if (direction === 'up') {
      textClone.style.top = '100%'
      timeline
        .fromTo(textSplit.chars, { yPercent: 0, ...animationProps }, { yPercent: -100, ...toStateProps })
        .fromTo(clonedSplit.chars, { yPercent: 0, ...animationProps }, { yPercent: -100, ...toStateProps }, '<')
    } else if (direction === 'down') {

        .fromTo(clonedSplit.chars, { yPercent: 0, ...animationProps }, { yPercent: 100, ...toStateProps }, '<')

      timeline.restart()
    })

      gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([0,0,0,0]));
      gl.activeTexture(previousUnit);
      gl.useProgram(program);
      gl.uniform2fv(locations.delta,water.textureDelta);
      gl.uniform1i(locations.samplerLogo,2);
      // Preserve 01A's original ripple simulation and original render uniforms.
      water.renderProgram={id:program,locations:locations,uniforms:water.renderProgram.uniforms};
      if(!updateLogo())logo.addEventListener('load',updateLogo,{once:true});
      window.addEventListener('resize',function(){
        cancelAnimationFrame(resizeFrame);
        resizeFrame=requestAnimationFrame(updateLogo);
      },{passive:true});
    }catch(e){
      hero.classList.remove('dpnco-letter-water-ready');
      console.warn('DPNCO letter refraction could not initialize:',e);
    }
  }
  setup();
})();
</script>

<script id="dpnco-auto-hide-controls">
(function(){
 var timer=null,lastMouse=0;
 function reveal(){
  document.body.classList.add('dpnco-controls-visible');
  clearTimeout(timer);
  timer=setTimeout(function(){
   document.body.classList.remove('dpnco-controls-visible');
  },3000);
 }
 function init(){
  document.body.classList.remove('dpnco-controls-visible');
  window.addEventListener('touchstart',reveal,{capture:true,passive:true});
  window.addEventListener('pointerdown',reveal,{capture:true,passive:true});
  window.addEventListener('click',reveal,{capture:true,passive:true});
  window.addEventListener('touchmove',reveal,{capture:true,passive:true});
  window.addEventListener('pointermove',function(e){
   if(e.pointerType==='touch')return;
   var now=Date.now();if(now-lastMouse<100)return;
   lastMouse=now;reveal();
  },{passive:true});
  window.addEventListener('keydown',reveal);
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();
</script>

<script id="dpnco-unified-button-feedback">
(function(){
 var selector='[data-dpnco-rain-toggle],[data-dpnco-sound-toggle],.dpnco-river-contact a,.dpnco-river-contact .dpnco-statement-shortcut';
 function activate(e){
  var el=e.target&&e.target.closest&&e.target.closest(selector);
  if(!el)return;
  el.classList.add('dpnco-button-active');
  clearTimeout(el._dpncoDimTimer);
  el._dpncoDimTimer=setTimeout(function(){el.classList.remove('dpnco-button-active');},1400);
 }
 document.addEventListener('pointerdown',activate,{capture:true,passive:true});
 document.addEventListener('touchstart',activate,{capture:true,passive:true});
 document.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' ')activate(e);},true);
})();

   Keep the four controls tappable without modifying their appearance. */
@media (hover:none) and (pointer:coarse){
 html,body.body-black{overflow-y:auto!important;touch-action:pan-y pinch-zoom!important;}

<script id="dpnco-mobile-swipe-scroll-fallback">
/* The fixed WebGL hero can swallow native swipe scrolling in iOS Chrome.
   On a vertical one-finger drag over the water, move the real document;
   scroll listeners (including the motto) still receive normal scroll events. */
(function(){
 var startY=0,lastY=0,startX=0,tracking=false,manual=false;
 function isControl(target){
  return !!(target&&target.closest&&target.closest('a,button,input,textarea,select,.dpnco-gayageum-zone'));
 }
 document.addEventListener('touchstart',function(e){
  tracking=false;manual=false;
  if(e.touches.length!==1||isControl(e.target))return;
  var hero=document.querySelector('.hero');
  if(!hero||!hero.contains(e.target))return;
  startY=lastY=e.touches[0].clientY;startX=e.touches[0].clientX;tracking=true;
 },{passive:true});
 document.addEventListener('touchmove',function(e){
  if(!tracking||e.touches.length!==1)return;
  var t=e.touches[0],dy=t.clientY-lastY,overallY=t.clientY-startY,overallX=t.clientX-startX;
  if(!manual){
   if(Math.abs(overallY)<8||Math.abs(overallY)<Math.abs(overallX)*1.2)return;
   manual=true;
  }
  if(!e.cancelable){tracking=false;return;}
  e.preventDefault();
  var controller=window.dpncoScrollController;
  if(!controller||!controller.moveTouch(-dy))window.scrollBy(0,-dy);
  lastY=t.clientY;
 },{passive:false});
 function end(){tracking=false;manual=false;}
 document.addEventListener('touchend',end,{passive:true});
 document.addEventListener('touchcancel',end,{passive:true});
})();
</script>
